
services:
  server:
    image: 106217160922.dkr.ecr.ap-south-1.amazonaws.com/cloudcart-backend:${IMAGE_TAG}
    env_file:
      - /home/ubuntu/CloudCart-devops/.env
    environment:
      NODE_ENV: production
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - cloudcart
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  client:
    image: 106217160922.dkr.ecr.ap-south-1.amazonaws.com/cloudcart-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - cloudcart
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  cloudcart:
    name: cloudcart_network

volumes:
  uploads_data:
    name: cloudcart_uploads

